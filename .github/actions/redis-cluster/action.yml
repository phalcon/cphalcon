name: 'Redis Cluster'
description: 'Start a local Redis Cluster on ports 5000-5005: three masters and three replicas.'

runs:
  using: 'composite'
  steps:
    - name: Start Redis Cluster
      # The packages come from the Ubuntu archive, so this step does not pull
      # an image from a container registry.
      shell: bash
      run: |
        # Keep only the Ubuntu archives - third-party repos only break us.
        # grep exits 1 when it lists no file, which is not an error here.
        { find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*.list' -o -name '*.sources' \) \
            -exec grep -LE 'ubuntu\.com|apt-mirrors\.txt' {} + || true; } \
            | sudo xargs -r rm -f
        sudo apt-get update || true

        # The package starts its own server on port 6379, which a redis
        # service container can use. policy-rc.d stops that start.
        printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
        sudo chmod +x /usr/sbin/policy-rc.d
        sudo apt-get install -y redis-server redis-tools
        sudo rm -f /usr/sbin/policy-rc.d

        ports="5000 5001 5002 5003 5004 5005"
        nodes=""

        for port in $ports; do
            dir="${RUNNER_TEMP}/redis-cluster/${port}"
            mkdir -p "$dir"
            redis-server \
                --port "$port" \
                --bind 127.0.0.1 \
                --cluster-enabled yes \
                --cluster-config-file "nodes-${port}.conf" \
                --cluster-node-timeout 5000 \
                --appendonly no \
                --save '' \
                --dir "$dir" \
                --logfile "${dir}/redis.log" \
                --daemonize yes
            nodes="$nodes 127.0.0.1:${port}"
        done

        for port in $ports; do
            for attempt in $(seq 1 50); do
                [ "$(redis-cli -p "$port" ping 2>/dev/null || true)" = "PONG" ] && break
                sleep 0.2
            done
        done

        redis-cli --cluster create $nodes --cluster-replicas 1 --cluster-yes

        # Wait until the cluster is healthy and each replica knows its role.
        for attempt in $(seq 1 50); do
            info="$(redis-cli -p 5000 cluster info || true)"
            replicas="$(redis-cli -p 5000 cluster nodes | grep -c slave || true)"
            [[ "$info" == *"cluster_state:ok"* && "$replicas" -eq 3 ]] && break
            sleep 0.2
        done

    - name: Check Redis Cluster
      shell: bash
      run: |
        redis-cli -h 127.0.0.1 -p 5000 ping
        redis-cli -h 127.0.0.1 -p 5000 cluster info | grep 'cluster_state:ok'
        [ "$(redis-cli -h 127.0.0.1 -p 5000 cluster nodes | grep -c slave)" -eq 3 ]
        redis-cli -h 127.0.0.1 -p 5000 cluster nodes
